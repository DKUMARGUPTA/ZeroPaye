name: ZeroPaye CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-lint-test:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Lint (ESLint)
        run: bun run lint

      - name: Unit Tests (Vitest)
        run: bun run test
        env:
          DATABASE_URL: "file:./ci.db"
          NODE_ENV: test

  integration-tests:
    name: Integration Tests (with server)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup SQLite + Prisma
        run: |
          bunx prisma generate
          # Switch schema to sqlite for CI
          sed -i 's/provider = "postgresql"/provider = "sqlite"/' prisma/schema.prisma
          bunx prisma generate
          bunx prisma db push
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Start dev server
        run: |
          bun run dev &
          sleep 15
          curl -sf http://localhost:3000/api/zeropaye/health || exit 1
        env:
          DATABASE_URL: "file:./ci.db"
          NODE_ENV: development

      - name: Integration Tests
        run: bun run test:integration
        env:
          DATABASE_URL: "file:./ci.db"
          NODE_ENV: development
